---
- name: Secure sudo for deploy
  hosts: all
  become: true
  tasks:
    - name: Ensure user 'deploy' has a password set
      ansible.builtin.user:
        name: deploy
        password: "{{ 'hunter12' | password_hash('sha512') }}"

    - name: Require password for deploy sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/deploy
        regexp: '^deploy\s+ALL=.*NOPASSWD:.*'
        line: 'deploy ALL=(ALL) ALL'
        validate: '/usr/sbin/visudo -cf %s'
        create: true
