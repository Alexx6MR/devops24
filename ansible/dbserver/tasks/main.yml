---
- name: Ensure MariaDB is installed
  ansible.builtin.package:
    name: mariadb-server
    state: present

- name: Start and enable MariaDB
  ansible.builtin.service:
    name: mariadb
    enabled: true
    state: started

- name: Ensure PyMySQL driver is present (required by community.mysql)
  ansible.builtin.package:
    name: python3-PyMySQL
    state: present

- name: Create database webappdb
  community.mysql.mysql_db:
    name: webappdb
    state: present
    login_unix_socket: "/var/lib/mysql/mysql.sock"
    check_implicit_admin: true

- name: Create user webappuser with ALL on webappdb.*
  community.mysql.mysql_user:
    name: webappuser
    password: "password"
    priv: "webappdb.*:ALL"
    state: present
    host: "%"
    login_unix_socket: "/var/lib/mysql/mysql.sock"
    check_implicit_admin: true
